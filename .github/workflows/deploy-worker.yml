name: Deploy KamRos worker

# Public runner for the private KamRos source. Bundles the worker and uploads
# only its script content via the Cloudflare API, preserving existing bindings,
# vars and secrets (the repo's wrangler.toml still carries placeholders).

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag or commit in the private KamRos repository'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: sketchnoobdeveloper/KamRos
  SOURCE_DIR: source
  SCRIPT_NAME: kamros

jobs:
  deploy:
    name: Bundle and deploy worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate secrets
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in PRIVATE_REPO_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is missing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Checkout private source (read-only token)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref || 'main' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ${{ env.SOURCE_DIR }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and bundle worker
        working-directory: source/worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npx wrangler deploy --dry-run --outdir dist
          echo "### Bundled files"
          find dist -type f -printf '- %p (%s bytes)\n'

      - name: Upload script content (bindings preserved)
        shell: bash
        working-directory: source/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd dist
          args=(-sS -X PUT
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
            -H 'CF-WORKER-MAIN-MODULE-PART: index.js'
            -F 'metadata={"main_module":"index.js"};type=application/json')
          for f in $(find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.wasm' \) -printf '%f\n'); do
            case "$f" in
              *.wasm) mime='application/wasm' ;;
              *)      mime='application/javascript+module' ;;
            esac
            args+=(-F "$f=@$f;type=$mime")
          done
          curl "${args[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/content" \
            -o /tmp/deploy-response.json
          python3 -c '
          import json,sys
          d=json.load(open("/tmp/deploy-response.json"))
          if not d.get("success"):
              print("Cloudflare deploy failed:", d.get("errors")); sys.exit(1)
          print("Worker script uploaded; bindings and secrets preserved")
          '

      - name: Verify health
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          HOST=$(curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/deployments" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print(r.get("workers_dev_host") or "")')
          if [ -z "$HOST" ]; then
            echo "Deploy uploaded; health check skipped (workers.dev host not returned by API)"
            exit 0
          fi
          curl -fsS "https://$HOST/health"
